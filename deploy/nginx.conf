events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        server_name _;
        client_max_body_size 10m;

        # Product images are written to Laravel's public storage disk and
        # are the only Laravel content served directly to the public.
        location ^~ /storage/ {
            alias /var/www/storage/app/public/;
            expires 1h;
        }

        # Stripe must reach Laravel with its original raw request body.
        location = /api/stripe/webhook {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/public;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_HOST $host;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_pass api:9000;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_pass http://frontend:3000;
        }
    }

    # This port is private to the Docker network. Next.js uses it for every
    # server-side call to Laravel, keeping the rest of the API off the internet.
    server {
        listen 8080;
        server_name _;
        client_max_body_size 10m;

        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/public;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_HOST $host;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_pass api:9000;
        }
    }
}
