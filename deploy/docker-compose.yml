name: cea-hardware-eshop

x-api-runtime: &api-runtime
  image: cea-hardware-eshop-api:local
  env_file: .env
  environment:
    DB_HOST: db
    DB_PORT: 3306
  volumes:
    - laravel_storage:/var/www/storage

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    <<: *api-runtime
    command: php artisan migrate --force
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-runtime
    build:
      context: ..
      dockerfile: Dockerfile
    command: php-fpm
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue:
    <<: *api-runtime
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../../cea-hardware-eshop-next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${APP_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    image: cea-hardware-eshop-next:local
    restart: unless-stopped
    environment:
      LARAVEL_API_URL: http://gateway:8080

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - laravel_storage:/var/www/storage:ro

volumes:
  mysql_data:
  laravel_storage:
